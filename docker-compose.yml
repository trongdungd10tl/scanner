# Starts the NSFW scanning service on port 8000. Everything it needs, model
# weights included, is inside the image, so there is nothing to prepare first.
#
# API_KEYS lists each caller as name:sha256-of-their-key, comma separated. Only
# the digests live here; each key is handed to its caller out of band. Issue one
# with: python issue_key.py NAME
#
# Removing a caller's entry revokes that caller alone. RATE_LIMIT_PER_MINUTE
# applies to each caller separately and counts frames, not requests, because a
# video costs as much as the frames it yields.
services:
  scanner:
    build:
      context: .
      args:
        # Set APT_MIRROR when deb.debian.org is slow from your build machine.
        # It measured 17 KB/s here against 12 MB/s for a local mirror.
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
    container_name: nsfw-scanner
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      API_KEYS: ${API_KEYS:-cms:a160b94cb17c13846d2faa495a48a290fb739de238a3c1374dfe834b6e586690}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
