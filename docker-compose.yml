# Dich vu quet anh NSFW cho kakoak, chay tren 10.226.234.15:8508.
#
# Chi goi noi bo, khong qua nginx hay ten mien: service API tren 10.226.234.49
# goi thang
#   POST http://10.226.234.15:8508/media-moderation/scan   (form: url=<link anh>)
#
# Khong co xac thuc: may nao trong mang toi duoc cong 8508 deu goi duoc, nen
# cong nay khong duoc mo ra Internet.
services:
  scanner:
    # Ghim ten image. Khong co dong nay thi compose tu dat ten theo THU MUC
    # (<thu-muc>-scanner), nen doi ten thu muc tren server la no khong thay image
    # da nap va build lai tu dau.
    image: moderation-scanner:latest
    # Image da nap san bang "docker load"; khong bao gio tu keo hay tu build.
    pull_policy: never
    container_name: nsfw-scanner
    restart: unless-stopped
    # Dung thang mang cua may chu, khong tao network rieng. Tren kakoak-app03
    # chain DOCKER trong iptables bi xoa nen Docker khong tao duoc network moi
    # ("Unable to enable SKIP DNAT rule"). Dich vu nghe thang cong 8508 cua may.
    network_mode: host
    # Log ghi ra ./logs de doc bang tail ma khong phai vao container.
    # Container chay bang uid 10001, nen thu muc nay tren may chu phai thuoc ve
    # uid do: mkdir -p logs && chown 10001:10001 logs
    # Khong co quyen chown thi mo quyen ghi: mkdir -p logs && chmod 777 logs
    volumes:
      - ./logs:/app/logs
    environment:
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      # Host duoc phep tai du phan giai ra dia chi noi bo. Chot chong SSRF chan
      # moi dia chi noi bo, nen anh nam tren may trong mang 10.226.x phai duoc
      # neu ten o day. Chi neu dung host can thiet, ngan cach bang dau phay.
      ALLOW_HOSTS: ${ALLOW_HOSTS:-}
      # Tai anh CDN tu dia chi noi bo thay vi dia chi public. Tu trong mang,
      # videocdn.kakoak.tls.tl (43.243.120.248) tu choi ket noi; nginx cua CDN
      # chay ngay tren may nay o cong 8080. Container dung mang cua may chu
      # (network_mode: host) nen 127.0.0.1 chinh la 10.226.234.15.
      FETCH_VIA: ${FETCH_VIA:-videocdn.kakoak.tls.tl=127.0.0.1:8080}
