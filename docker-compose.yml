# Starts the NSFW scanning service on port 8000. Everything it needs, model
# weights included, is inside the image, so there is nothing to prepare first.
#
# There is no authentication: anything that can reach port 8000 may use it. The
# published port below must therefore stay on a network you control, or sit
# behind a gateway that does the authenticating.
#
# RATE_LIMIT_PER_MINUTE applies per client address and counts frames, not
# requests, because a video costs as much as the frames it yields. Behind a
# reverse proxy every caller arrives wearing the proxy's address and shares one
# budget.
services:
  scanner:
    # Ghim ten image. Khong co dong nay thi compose tu dat ten theo THU MUC
    # (<thu-muc>-scanner), nen doi ten thu muc tren server la no khong thay image
    # da nap va build lai tu dau.
    image: moderation-scanner:latest
    build:
      context: .
      args:
        # Set APT_MIRROR when deb.debian.org is slow from your build machine.
        # It measured 17 KB/s here against 12 MB/s for a local mirror.
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
    container_name: nsfw-scanner
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Log ghi ra ./logs de doc bang tail ma khong phai vao container.
    # Container chay bang uid 10001, nen thu muc nay tren may chu phai thuoc ve
    # uid do: mkdir -p logs && chown 10001:10001 logs
    volumes:
      - ./logs:/app/logs
    environment:
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      # Hosts the scanner may fetch from even though they resolve to a private
      # address. The application sending links usually sits on one, and without
      # naming it the check that stops the scanner being an open proxy also
      # stops it reading what the caller owns. List only what is needed:
      #   ALLOW_HOSTS=cms.internal,192.168.1.10
      ALLOW_HOSTS: ${ALLOW_HOSTS:-}
